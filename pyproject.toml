[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-venue-insights"
version = "0.2.0"
description = "Analyze NeurIPS, ICML, ICLR, RLC and COLT papers from titles + abstracts only — themes, topics, and cross-venue trends without downloading PDFs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mahdi" }]
keywords = [
    "neurips", "icml", "iclr", "colt", "rlc",
    "nlp", "topic-modeling", "bertopic", "research-trends",
]

# Core deps: scraping + streaming stats only. Heavy ML is optional.
# requests/bs4 cover the HTML backends (NeurIPS, PMLR); the OpenReview
# backend (ICLR, RLC) also only needs requests.
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]

[project.optional-dependencies]
# Deep embedding-native analysis (clusters, search, neighbors, trends)
analyze = [
    "sentence-transformers>=2.2",
    "scikit-learn>=1.2",
    "numpy>=1.23",
    "hdbscan>=0.8",
]
# NOTE: --compare and --stats need NO extra deps. The cross-venue log-odds
# scoring is pure stdlib maths, so a core install can already pool corpora and
# produce the venue-signature report. --theme-mix additionally needs an
# analysis.json, so it inherits the [analyze] extra.
# Embedding-based topic modeling (legacy --topics path)
topics = [
    "sentence-transformers>=2.2",
    "scikit-learn>=1.2",
    "scipy>=1.9",
    "numpy>=1.23",
]
# Richer legacy topic path
bertopic = [
    "bertopic>=0.16",
    "sentence-transformers>=2.2",
    "scikit-learn>=1.2",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
]
all = [
    "ml-venue-insights[analyze,topics,bertopic]",
]

[project.scripts]
ml-venue-insights = "ml_venue_insights.cli:main"
# Legacy alias, kept so the old command still works.
neurips-insights = "ml_venue_insights.cli:main"

[project.urls]
Homepage = "https://github.com/yourname/ml-venue-insights"
Issues = "https://github.com/yourname/ml-venue-insights/issues"

[tool.setuptools.packages.find]
include = ["ml_venue_insights*"]
